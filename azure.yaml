# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.9"
name: data-room-intelligence
services:
  ai-project:
    host: azure.ai.project
  data-room-intelligence-qa:
    host: azure.ai.agent
    project: hosted_agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: data-room-intelligence-qa
    description: Cited Q&A over deterministic, normalized acquisition data-room outputs.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      DATA_ROOM_STORAGE_ACCOUNT_URL: ${DATA_ROOM_STORAGE_ACCOUNT_URL}
      DATA_ROOM_STORAGE_CONTAINER: ${DATA_ROOM_STORAGE_CONTAINER}
      DATA_ROOM_ASSET_ID: ${DATA_ROOM_ASSET_ID}
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
infra:
  provider: microsoft.foundry
